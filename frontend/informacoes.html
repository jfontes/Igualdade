<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Informações</title>
    <link rel="manifest" href="/manifest.json?v=5">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input, select { transition: all 0.3s ease; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="font-sans pb-10" style="background-color: #fffafa;">

    <header style="background-color: #560710;" class="text-white p-5 shadow-lg rounded-b-2xl mb-6 relative">
        <a href="index.html" class="absolute left-4 top-5 text-white opacity-80 hover:opacity-100 font-bold">← Voltar</a>
        <h1 class="text-lg font-bold text-center mt-1">Minhas Informações</h1>
    </header>

    <main class="px-4 space-y-6 max-w-md mx-auto">
        <section class="bg-white p-5 rounded-xl shadow-sm border-l-4" style="border-color: #560710;">
            <h2 style="color: #560710;" class="font-bold mb-4 uppercase text-xs tracking-wider">Identificação</h2>
            <input type="text" id="nome" placeholder="NOME COMPLETO" class="w-full p-3 border border-red-50 rounded-lg mb-3 uppercase outline-none focus:ring-2 focus:ring-[#560710]">
            <div class="grid grid-cols-2 gap-3">
                <div class="relative w-full">
                    <input type="text" id="cim" placeholder="CIM (APENAS NÚMEROS)" inputmode="numeric" pattern="[0-9]*" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full p-3 pr-12 border border-red-50 rounded-lg outline-none focus:ring-2 focus:ring-[#560710]">
                    <button type="button" onclick="buscarCIM()" id="btn-buscar-cim" class="absolute right-1 top-1 p-2 text-[#560710] hover:bg-red-50 rounded-lg transition-colors" title="Buscar por CIM">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                </div>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)" class="w-full p-3 border border-red-50 rounded-lg outline-none focus:ring-2 focus:ring-[#560710]">
            </div>
            <div class="mt-3">
                <label for="data_nascimento" class="text-[10px] font-bold text-[#560710] ml-1 mb-1 opacity-70 uppercase">Data de Nascimento</label>
                <input type="date" id="data_nascimento" style="color: #560710;" class="w-full p-3 rounded-lg border border-red-50 bg-white outline-none focus:ring-2 focus:ring-[#560710]">
            </div>
        </section>

        <section class="bg-white p-5 rounded-xl shadow-sm border-l-4" style="border-color: #560710;">
            <h2 style="color: #560710;" class="font-bold mb-4 uppercase text-xs tracking-wider">Endereço Residencial</h2>
            <div class="grid grid-cols-3 gap-2 mb-3">
                <div class="col-span-1 relative">
                    <input type="text" id="cep" placeholder="00000-000" maxlength="9" oninput="mascaraCEP(this)" onkeyup="buscarCEP(this.value)" class="w-full p-3 border border-red-50 rounded-lg outline-none focus:ring-2 focus:ring-[#560710]">
                    <div id="loader-cep" class="hidden absolute right-2 top-3">
                        <svg class="animate-spin h-5 w-5" style="color: #560710;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                </div>
                <input type="text" id="logradouro" placeholder="LOGRADOURO" class="col-span-2 p-3 border border-red-50 rounded-lg uppercase bg-gray-50" readonly>
            </div>
            <div class="grid grid-cols-4 gap-2">
                <input type="text" id="numero" placeholder="Nº" inputmode="numeric" pattern="[0-9]*" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="col-span-1 p-3 border border-red-50 rounded-lg outline-none focus:ring-2 focus:ring-[#560710]">
                <input type="text" id="bairro" placeholder="BAIRRO" class="col-span-3 p-3 border border-red-50 rounded-lg uppercase outline-none focus:ring-2 focus:ring-[#560710]">
            </div>
            <div class="grid grid-cols-2 gap-2 mt-3">
                <input type="text" id="cidade" placeholder="CIDADE" class="p-3 border border-red-50 rounded-lg uppercase outline-none focus:ring-2 focus:ring-[#560710]">
                <input type="text" id="estado" placeholder="UF" maxlength="2" class="p-3 border border-red-50 rounded-lg uppercase text-center outline-none focus:ring-2 focus:ring-[#560710]">
            </div>
        </section>
        
        <section class="bg-[#fdf2f2] p-5 rounded-xl shadow-sm border-l-4" style="border-color: #560710;">
            <h2 style="color: #560710;" class="font-bold mb-4 uppercase text-xs tracking-wider">Datas Importantes</h2>
            <div class="space-y-3">
                <div><label class="text-xs" style="color: #560710;">Iniciação</label>
                <input type="date" id="data_iniciacao" class="w-full p-2 rounded-lg border-none outline-none focus:ring-2 focus:ring-[#560710]"></div>
                <div><label class="text-xs" style="color: #560710;">Elevação</label>
                <input type="date" id="data_elevacao" class="w-full p-2 rounded-lg border-none outline-none focus:ring-2 focus:ring-[#560710]"></div>
                <div><label class="text-xs" style="color: #560710;">Exaltação</label>
                <input type="date" id="data_exaltacao" class="w-full p-2 rounded-lg border-none outline-none focus:ring-2 focus:ring-[#560710]"></div>
                <div><label class="text-xs" style="color: #560710;">Filiação</label>
                <input type="date" id="data_filiacao" class="w-full p-2 rounded-lg border-none outline-none focus:ring-2 focus:ring-[#560710]"></div>
                <div><label class="text-xs" style="color: #560710;">Instalação</label>
                <input type="date" id="data_instalacao" class="w-full p-2 rounded-lg border-none outline-none focus:ring-2 focus:ring-[#560710]"></div>
                <div><label class="text-xs" style="color: #560710;">Afastamento</label>
                <input type="date" id="data_afastamento" class="w-full p-2 rounded-lg border-none outline-none focus:ring-2 focus:ring-[#560710]"></div>
            </div>
        </section>

        <button onclick="enviarDados()" id="btnSalvar" style="background-color: #560710;" class="w-full text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95">
            SALVAR INFORMAÇÕES
        </button>
    </main>

    <script src="app.js?v=3"></script>
</body>
</html>
