<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secretaria - Cadastro</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 font-sans pb-10">

    <header class="bg-blue-900 text-white p-6 shadow-lg rounded-b-2xl mb-6">
        <h1 class="text-xl font-bold text-center">Cadastro de Obreiro</h1>
    </header>

    <main class="px-4 space-y-6">
        <section class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-600">
            <h2 class="text-blue-800 font-bold mb-4 uppercase text-xs tracking-wider">Identificação</h2>
            <input type="text" id="nome" placeholder="Nome Completo" class="w-full p-3 border border-blue-100 rounded-lg mb-3 focus:ring-2 focus:ring-blue-500 outline-none">
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="cim" placeholder="CIM" class="p-3 border border-blue-100 rounded-lg">
                <input type="text" id="cpf" placeholder="CPF" class="p-3 border border-blue-100 rounded-lg">
            </div>
        </section>

        <section class="bg-blue-100 p-5 rounded-xl shadow-sm">
            <h2 class="text-blue-900 font-bold mb-4 uppercase text-xs tracking-wider">Datas Importantes</h2>
            <div class="space-y-3">
                <div><label class="text-xs text-blue-700">Iniciação</label>
                <input type="date" id="data_iniciacao" class="w-full p-2 rounded-lg border-none"></div>
                <div><label class="text-xs text-blue-700">Elevação</label>
                <input type="date" id="data_elevacao" class="w-full p-2 rounded-lg border-none"></div>
                <div><label class="text-xs text-blue-700">Exaltação</label>
                <input type="date" id="data_exaltacao" class="w-full p-2 rounded-lg border-none"></div>
                <div><label class="text-xs text-blue-700">Filiação</label>
                <input type="date" id="data_filiacao" class="w-full p-2 rounded-lg border-none"></div>
            </div>
        </section>
        
        <section class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-300">
            <h2 class="text-blue-800 font-bold mb-4 uppercase text-xs tracking-wider">Dependentes / Familiares</h2>
            
            <div id="lista-familiares" class="space-y-4 mb-4"></div>
        
            <button type="button" onclick="adicionarCampoFamiliar()" class="w-full py-3 border-2 border-dashed border-blue-300 text-blue-600 rounded-lg font-medium active:bg-blue-50">
                + Adicionar Sobrinho(a) ou Cunhada
            </button>
        </section>
        
        <section class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-600">
            <h2 class="text-blue-800 font-bold mb-4 uppercase text-xs tracking-wider">Identificação</h2>
            <input type="text" id="nome" placeholder="NOME COMPLETO" class="w-full p-3 border border-blue-100 rounded-lg mb-3 uppercase">
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="cim" placeholder="CIM" class="p-3 border border-blue-100 rounded-lg">
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)" class="p-3 border border-blue-100 rounded-lg">
            </div>
        </section>
        
        <section class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-400">
            <h2 class="text-blue-800 font-bold mb-4 uppercase text-xs tracking-wider">Endereço Residencial</h2>
            <div class="grid grid-cols-3 gap-2 mb-3">
                <input type="text" id="cep" placeholder="CEP" class="col-span-1 p-3 border border-blue-100 rounded-lg">
                <input type="text" id="logradouro" placeholder="LOGRADOURO (RUA/AV)" class="col-span-2 p-3 border border-blue-100 rounded-lg uppercase">
            </div>
            <div class="grid grid-cols-4 gap-2">
                <input type="text" id="numero" placeholder="Nº" class="col-span-1 p-3 border border-blue-100 rounded-lg uppercase">
                <input type="text" id="bairro" placeholder="BAIRRO" class="col-span-3 p-3 border border-blue-100 rounded-lg uppercase">
            </div>
            <div class="grid grid-cols-2 gap-2 mt-3">
                <input type="text" id="cidade" placeholder="CIDADE" class="p-3 border border-blue-100 rounded-lg uppercase">
                <input type="text" id="estado" placeholder="UF" maxlength="2" class="p-3 border border-blue-100 rounded-lg uppercase text-center">
            </div>
        </section>

        <button onclick="enviarDados()" id="btnSalvar" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-4 rounded-xl shadow-blue-200 shadow-lg transition-all active:scale-95">
            SALVAR CADASTRO
        </button>
    </main>

    <script src="app.js"></script>
</body>
</html>
