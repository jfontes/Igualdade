<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Familiares</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input, select { transition: all 0.3s ease; }
    </style>
</head>
<body class="font-sans pb-10" style="background-color: #fffafa;">
    <header style="background-color: #560710;" class="text-white p-5 shadow-lg rounded-b-2xl mb-6 relative">
        <a href="home.html" class="absolute left-4 top-5 text-white opacity-80 hover:opacity-100 font-bold">← Voltar</a>
        <h1 class="text-lg font-bold text-center mt-1">Meus Familiares</h1>
    </header>

    <main class="px-4 space-y-6 max-w-md mx-auto">
        <section class="bg-white p-5 rounded-xl shadow-sm border-l-4" style="border-color: #560710;">
            <p class="text-xs font-bold text-[#560710] mb-2 uppercase opacity-80">1. Digite seu CIM para buscar</p>
            <div class="relative w-full mb-2">
                <input type="text" id="cim" placeholder="CIM (APENAS NÚMEROS)" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full p-3 pr-12 border border-red-50 rounded-lg outline-none focus:ring-2 focus:ring-[#560710]">
                <button type="button" onclick="buscarCIM()" id="btn-buscar-cim" class="absolute right-1 top-1 p-2 text-[#560710] hover:bg-red-50 rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
            <div id="nome-readonly" class="text-xs text-gray-500 font-bold uppercase"></div>
        </section>
        
        <section class="bg-[#fdf2f2] p-5 rounded-xl shadow-sm border-l-4" style="border-color: #ecdada;">
            <h2 style="color: #560710;" class="font-bold mb-4 uppercase text-xs tracking-wider">Lista de Dependentes</h2>
            <div id="lista-familiares" class="space-y-4 mb-4"></div>
            <button type="button" onclick="adicionarCampoFamiliar()" style="border-color: #ecdada; color: #560710;" class="w-full py-3 border-2 border-dashed rounded-lg font-bold bg-white active:bg-red-50">
                + Adicionar Novo
            </button>
        </section>

        <button onclick="salvarFamiliaresSeparado()" id="btnSalvarFamiliares" style="background-color: #560710;" class="w-full text-white font-bold py-4 rounded-xl shadow-lg active:scale-95">
            SALVAR FAMILIARES
        </button>
    </main>
    <script src="app.js"></script>
</body>
</html>
