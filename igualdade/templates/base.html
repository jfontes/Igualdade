<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#560710">
  <title>{% block titulo %}{{ LOJA.nome }}{% endblock %} · Igualdade</title>
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='brasao-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Igualdade">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=33">
</head>
<body class="{% block body_class %}{% endblock %}">
{% block corpo %}
  {% set ep = request.endpoint or '' %}
  <header class="topo">
    <div class="topo-interno">
      <a class="marca" href="{{ url_for('main.painel') }}">
        <img src="{{ url_for('static', filename='brasao-192.png') }}" alt="Brasão">
        <span>{{ LOJA.nome }}</span>
      </a>
      <span class="espaco"></span>
      <nav class="nav" aria-label="Navegação principal">
        <a href="{{ url_for('main.painel') }}" class="{{ 'ativo' if ep == 'main.painel' }}"><span class="ic">🏠</span>Início</a>
        <a href="{{ url_for('main.minhas_informacoes') }}" class="{{ 'ativo' if ep == 'main.minhas_informacoes' or ep.startswith('main.familiar') }}"><span class="ic">👤</span>Meus dados</a>
        <a href="{{ url_for('tesouraria.minha') }}" class="{{ 'ativo' if ep.startswith('tesouraria.') or ep.startswith('relatorios.') }}"><span class="ic">💰</span>Tesouraria</a>
        <a href="{{ url_for('main.agenda') }}" class="{{ 'ativo' if ep == 'main.agenda' or ep.startswith('sessoes.') or ep.startswith('balaustre.') }}"><span class="ic">🗓️</span>Agenda</a>
        <a href="{{ url_for('main.obreiros') }}" class="{{ 'ativo' if ep in ('main.obreiros', 'main.perfil', 'main.historico', 'main.historico_detalhe') or ep.startswith('admin.') or ep.startswith('diretoria.') }}"><span class="ic">🏛️</span>Obreiros</a>
      </nav>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn-sair" type="submit">Sair</button>
      </form>
    </div>
  </header>
  <main>
    {% include "_mensagens.html" %}
    {% block conteudo %}{% endblock %}
  </main>
{% endblock %}
<script src="{{ url_for('static', filename='app.js') }}?v=17" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
