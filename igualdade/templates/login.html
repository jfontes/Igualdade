{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block body_class %}sem-nav{% endblock %}
{% block corpo %}
<div class="login">
  <div class="cartao">
    <div class="marca">
      <img src="{{ url_for('static', filename='brasao.png') }}" alt="Brasão da Loja">
      <h1>{{ LOJA.nome }}</h1>
      <p>Cadastro de Obreiros e Familiares</p>
    </div>
    {% include "_mensagens.html" %}
    <form method="post" class="grade">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="campo">
        <label for="cim">CIM</label>
        <input id="cim" name="cim" inputmode="numeric" autocomplete="username" required autofocus
               value="{{ request.form.cim }}">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        <span class="dica">Primeiro acesso: use o seu CPF (somente números).</span>
      </div>
      <label class="check"><input type="checkbox" name="lembrar" value="1" checked> Manter conectado neste aparelho</label>
      <button class="btn bloco" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
